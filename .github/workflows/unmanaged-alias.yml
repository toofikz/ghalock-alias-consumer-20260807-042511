name: Unmanaged alias syntax control

env:
  ACTION_REF: &action_ref toofikz2/ghalock-alias-action-20260807-042511@alias-v1

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  probe:
    if: >-
      github.event.issue.pull_request &&
      github.repository == 'toofikz/ghalock-alias-consumer-20260807-042511' &&
      github.actor == 'toofikz2' &&
      github.event.issue.number == 1 &&
      github.event.comment.body == 'GHALOCK_UNMANAGED_ALIAS_b18a230b46a5071c'
    runs-on: ubuntu-latest
    steps:
      - name: Aliased dependency without lock management
        uses: *action_ref
        with:
          mode: alias
          phase: pre
